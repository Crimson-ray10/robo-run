{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Robot Runner{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'game/css/style.css' %}?v=6">
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a href="{% url 'game:home' %}" class="brand nb-surface">
            <span class="brand-mascot-wrap">
                <svg class="brand-mascot-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <line x1="18" y1="2" x2="18" y2="7" stroke="#0B2A19" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="18" cy="3" r="2" fill="#FF6B4A" stroke="#0B2A19" stroke-width="1.5"/>
                    <rect x="5" y="7" width="26" height="23" rx="5" fill="#1FAFA0" stroke="#0B2A19" stroke-width="2.5"/>
                    <rect x="9" y="11" width="18" height="9" rx="3" fill="#FBF3E3" stroke="#0B2A19" stroke-width="2"/>
                    <circle cx="14" cy="15.5" r="2.2" fill="#0B2A19"/>
                    <circle cx="22" cy="15.5" r="2.2" fill="#0B2A19"/>
                    <circle cx="14.8" cy="14.8" r="0.8" fill="#FFFFFF"/>
                    <circle cx="22.8" cy="14.8" r="0.8" fill="#FFFFFF"/>
                    <line x1="12" y1="24" x2="24" y2="24" stroke="#0B2A19" stroke-width="2" stroke-linecap="round"/>
                    <rect x="2" y="14" width="3" height="7" rx="1.5" fill="#FFC94A" stroke="#0B2A19" stroke-width="1.5"/>
                    <rect x="31" y="14" width="3" height="7" rx="1.5" fill="#FFC94A" stroke="#0B2A19" stroke-width="1.5"/>
                </svg>
            </span>
            <span class="brand-text">Robot Runner</span>
        </a>
        <div class="topbar-actions">
            <button id="sound-toggle-btn" class="topbar-btn sound-btn nb-surface" title="Toggle audio effects">🔊 Sound On</button>
        </div>
    </div>
</header>
<main class="page-container">
    {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
